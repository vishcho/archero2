<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="img/fire.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘汰賽對陣 — 弓箭傳說2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .bet-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.96)); }
    .metric-bar { height: 3px; border-radius: 999px; background: #334155; overflow: hidden; }
    .metric-bar > span { display: block; height: 100%; border-radius: inherit; background: #eab308; }
    .bracket-landscape { display: none; }
    @media (min-width: 768px) {
      .bracket-portrait { display: none; }
      .bracket-landscape { display: block; }
    }
  </style>
</head>
<body class="p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
    <div class="mb-4 flex items-center gap-3 flex-wrap">
      <a id="back-link" href="index.html" class="text-slate-500 hover:text-white text-sm">← 返回</a>
      <h1 id="title" class="text-xl font-bold text-yellow-400">淘汰賽對陣</h1>
    </div>
    <div id="tabs" class="flex gap-2 mb-6 flex-wrap"></div>
    <div id="bracket-section">
      <div class="flex items-end justify-between gap-4 mb-3">
        <div>
          <h2 class="font-bold text-slate-100">完整對陣路徑</h2>
          <p class="text-xs text-slate-500 mt-1">金色標記直接顯示每一輪建議押注對象</p>
        </div>
        <span class="hidden md:inline text-xs text-slate-500">由外向中央晉級</span>
      </div>
      <div id="bracket-wrap" class="overflow-x-auto pb-3"></div>
    </div>
    <div id="advice-wrap" class="mt-8"></div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/bracket-view-model.js"></script>
  <script>
    // 對陣位置與晉級關係以 matches 為準；players 陣列順序不代表對陣位置。
    // view model 會處理不同屆次的 A/B 或 A/C 晉級路徑以及同名玩家身分。
    function bettingPlayers(group) {
      const vm = buildBracketViewModel(group);
      const bySlot = (slot) => vm.r1.find((match) => match.slot === slot);
      const order = [
        vm.layout.leftTop,
        vm.layout.leftBottom,
        vm.layout.rightTop,
        vm.layout.rightBottom,
      ];
      return order.flatMap((slot) => {
        const match = bySlot(slot);
        return [match?.p1, match?.p2].map((card) => card && ({
          ...card,
          prev_progress: card.prev_best,
          qualifier_time: card.qualifier_time || card.time,
          _slot: slot,
        }));
      });
    }
    function parsePower(value) {
      if (!value) return null;
      const match = String(value).match(/^([\d.]+)([MK]?)$/i);
      if (!match) return null;
      const multiplier = match[2].toUpperCase() === 'M' ? 1000000
        : match[2].toUpperCase() === 'K' ? 1000 : 1;
      return Number(match[1]) * multiplier;
    }

    function parseTime(value) {
      if (!value) return null;
      const parts = String(value).split(':').map(Number);
      if (parts.some(Number.isNaN)) return null;
      return parts.length === 2 ? parts[0] * 60 + parts[1] : parts[0];
    }

    function parseProgress(value) {
      if (!value) return null;
      const match = String(value).match(/^(\d+)\/(\d+)$/);
      return match ? Number(match[1]) / Number(match[2]) : null;
    }

    function metricVote(a, b, key, lowerWins = false) {
      const av = key === 'power' ? parsePower(a[key]) : parseTime(a[key]);
      const bv = key === 'power' ? parsePower(b[key]) : parseTime(b[key]);
      if (av == null || bv == null || av === bv) return null;
      const winner = (lowerWins ? av < bv : av > bv) ? a : b;
      const gap = Math.abs(av - bv) / Math.max(av, bv);
      return { winner, gap };
    }

    function analyzeMatch(a, b) {
      const aProgress = parseProgress(a.prev_progress);
      const bProgress = parseProgress(b.prev_progress);
      let primary = null;
      let reason = '';

      if (aProgress != null || bProgress != null) {
        if (aProgress !== bProgress) {
          primary = (aProgress ?? -1) > (bProgress ?? -1) ? a : b;
          reason = `${primary.prev_progress || '有'}上屆進度領先`;
        } else if (aProgress === 1 && bProgress === 1) {
          const timeVote = metricVote(a, b, 'prev_time', true);
          if (timeVote) {
            primary = timeVote.winner;
            reason = `上屆通關 ${primary.prev_time} 較快`;
          }
        }
      }

      const powerVote = metricVote(a, b, 'power');
      const qualifierVote = metricVote(a, b, 'qualifier_time', true);
      if (!primary && powerVote) {
        primary = powerVote.winner;
        reason = `本屆戰力 ${primary.power} 較高`;
      }
      if (!primary && qualifierVote) {
        primary = qualifierVote.winner;
        reason = `資格賽 ${primary.qualifier_time} 較快`;
      }

      if (!primary) {
        return { winner: a, confidence: 'insufficient', reason: '雙方資料不足，建議跳過', conflict: true };
      }

      const votes = [powerVote, qualifierVote].filter(Boolean);
      const supporting = votes.filter(v => v.winner === primary).length;
      const opposing = votes.filter(v => v.winner !== primary).length;
      const strongGap = votes.some(v => v.winner === primary && v.gap >= 0.2);
      let confidence = supporting >= 2 || (supporting >= 1 && strongGap) ? 'high' : 'medium';
      if (opposing || (!votes.length && !primary.prev_progress)) confidence = 'low';

      return {
        winner: primary,
        confidence,
        reason,
        conflict: opposing > 0,
      };
    }

    const CONFIDENCE = {
      high: { label: '優勢明顯', icon: '●●●', cls: 'text-emerald-300 bg-emerald-500/10 border-emerald-500/30' },
      medium: { label: '可考慮', icon: '●●○', cls: 'text-yellow-300 bg-yellow-500/10 border-yellow-500/30' },
      low: { label: '小注觀望', icon: '●○○', cls: 'text-orange-300 bg-orange-500/10 border-orange-500/30' },
      insufficient: { label: '建議跳過', icon: '○○○', cls: 'text-slate-400 bg-slate-500/10 border-slate-500/30' },
    };

    function playerLabel(player) {
      const name = displayName(player);
      return player.player_id ? `${name} · ${player.player_id.slice(-4)}` : name;
    }

    function matchupCard(a, b, label) {
      const advice = analyzeMatch(a, b);
      const confidence = CONFIDENCE[advice.confidence];
      const winnerIsA = advice.winner === a;
      return `
        <article class="bet-card border border-slate-700 rounded-xl p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <span class="text-xs font-bold tracking-wider text-slate-500">首輪 ${label}</span>
            <span class="text-[11px] border rounded-full px-2 py-1 ${confidence.cls}">${confidence.icon} ${confidence.label}</span>
          </div>
          <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
            ${matchupPlayer(a, winnerIsA)}
            <span class="text-xs text-slate-600">VS</span>
            ${matchupPlayer(b, !winnerIsA)}
          </div>
          <div class="mt-4 pt-3 border-t border-slate-700/70">
            <div class="text-sm"><span class="text-slate-500">建議：</span><strong class="text-yellow-300">${playerLabel(advice.winner)}</strong></div>
            <p class="text-xs text-slate-400 mt-1.5 leading-5">${advice.reason}${advice.conflict ? '；其他指標方向不一致，需留意爆冷' : ''}</p>
          </div>
        </article>`;
    }

    function matchupPlayer(player, recommended) {
      const power = parsePower(player.power);
      const barWidth = power ? Math.min(100, Math.max(12, power / 700000)) : 0;
      return `
        <div class="min-w-0 ${recommended ? '' : 'opacity-60'}">
          <div class="text-sm font-semibold truncate ${recommended ? 'text-white' : 'text-slate-300'}">${playerLabel(player)}</div>
          <div class="text-xs text-slate-500 mt-1">${player.power || '戰力未知'} · ${player.qualifier_time || '時間未知'}</div>
          <div class="metric-bar mt-2"><span style="width:${barWidth}%"></span></div>
        </div>`;
    }

    function renderAdvice(g) {
      const p = bettingPlayers(g);
      const firstRound = [
        analyzeMatch(p[0], p[1]),
        analyzeMatch(p[2], p[3]),
        analyzeMatch(p[4], p[5]),
        analyzeMatch(p[6], p[7]),
      ];
      const upper = analyzeMatch(firstRound[0].winner, firstRound[2].winner);
      const lower = analyzeMatch(firstRound[1].winner, firstRound[3].winner);
      const final = analyzeMatch(upper.winner, lower.winner);
      const confidence = CONFIDENCE[final.confidence];
      const riskCount = [...firstRound, upper, lower, final].filter(a => a.conflict || a.confidence === 'insufficient').length;
      const finalPick = final.confidence === 'insufficient'
        ? '本組建議跳過'
        : playerLabel(final.winner);
      const finalPath = final.confidence === 'insufficient'
        ? '現有資料不足以區分預測晉級者'
        : `預測晉級：${playerLabel(upper.winner)} × ${playerLabel(lower.winner)}，${final.reason}`;

      return `
        <section class="mb-2">
          <div class="rounded-2xl border border-yellow-500/30 bg-yellow-500/5 p-5 md:p-6 mb-5">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">
              <div>
                <p class="text-xs font-bold tracking-widest text-yellow-500 uppercase">本組下注摘要</p>
                <div class="flex items-baseline gap-3 mt-2 flex-wrap">
                  <h2 class="text-2xl md:text-3xl font-black text-white">${finalPick}</h2>
                  <span class="text-xs border rounded-full px-2.5 py-1 ${confidence.cls}">${confidence.icon} ${confidence.label}</span>
                </div>
                <p class="text-sm text-slate-400 mt-2">${finalPath}</p>
              </div>
              <div class="md:text-right shrink-0">
                <div class="text-xs text-slate-500">路徑風險</div>
                <div class="text-lg font-bold mt-1 ${riskCount ? 'text-orange-300' : 'text-emerald-300'}">${riskCount ? `${riskCount} 場需留意` : '指標一致'}</div>
              </div>
            </div>
          </div>

          <div class="flex items-end justify-between gap-4 mb-3">
            <div>
              <h2 class="font-bold text-slate-100">首輪下注建議</h2>
              <p class="text-xs text-slate-500 mt-1">資料順位：上屆表現 ＞ 本屆戰力 ＞ 資格賽時間</p>
            </div>
          </div>
          <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-3">
            ${matchupCard(p[0], p[1], p[0]._slot)}
            ${matchupCard(p[2], p[3], p[2]._slot)}
            ${matchupCard(p[4], p[5], p[4]._slot)}
            ${matchupCard(p[6], p[7], p[6]._slot)}
          </div>
          <p class="text-[11px] text-slate-600 mt-3 leading-5">建議依現有歷史資料自動推估，不代表賽果保證；遇到「小注觀望」或「建議跳過」時，請優先保留投注額。</p>
        </section>`;
    }

    function renderPortraitBracket(g) {
      const p = bettingPlayers(g);
      const firstRound = [
        analyzeMatch(p[0], p[1]),
        analyzeMatch(p[2], p[3]),
        analyzeMatch(p[4], p[5]),
        analyzeMatch(p[6], p[7]),
      ];
      const upper = analyzeMatch(firstRound[0].winner, firstRound[2].winner);
      const lower = analyzeMatch(firstRound[1].winner, firstRound[3].winner);
      const final = analyzeMatch(upper.winner, lower.winner);
      const W = 420;
      const H = 1080;
      const NW = 92;
      const NH = 92;
      const leftX = 0;
      const leftInnerX = 105;
      const centerX = 164;
      const rightInnerX = 223;
      const rightX = 328;
      const topOuterY = [38, 270];
      const bottomOuterY = [718, 950];
      const topStageY = 154;
      const upperY = 382;
      const finalY = 494;
      const lowerY = 606;
      const bottomStageY = 834;

      function node(player, x, y, label, advice, featured = false) {
        const confidence = CONFIDENCE[advice.confidence];
        const skip = advice.confidence === 'insufficient';
        const border = skip ? '#64748b' : '#facc15';
        const bg = featured ? '#3a2809' : '#202337';
        const title = skip ? '跳過' : displayName(player);
        return `
          <foreignObject x="${x}" y="${y}" width="${NW}" height="${NH}">
            <div xmlns="http://www.w3.org/1999/xhtml"
                 style="height:${NH}px;box-sizing:border-box;padding:7px 6px;
                        border:${featured ? 3 : 2}px solid ${border};border-radius:12px;
                        background:${bg};box-shadow:0 4px 12px rgba(0,0,0,.35);">
              <div style="font-size:8px;color:${skip ? '#94a3b8' : '#facc15'};
                          font-weight:800;text-align:center;line-height:1.2;">${label}</div>
              <div style="font-size:11px;color:#f8fafc;font-weight:800;text-align:center;
                          line-height:1.15;word-break:break-all;overflow:hidden;height:26px;
                          margin-top:5px;">${title}</div>
              <div style="font-size:9px;color:#fde047;text-align:center;margin-top:3px;">
                ⚡ ${player.power || '—'}
              </div>
              <div style="font-size:8px;color:#94a3b8;text-align:center;margin-top:2px;">${confidence.icon}</div>
            </div>
          </foreignObject>`;
      }

      function entrantNode(player, x, y, advice, match) {
        const picked = advice.confidence !== 'insufficient' && advice.winner === player;
        const border = picked ? '#facc15' : '#475569';
        const rank = player.qualifier_rank != null ? `#${player.qualifier_rank} ` : '';
        return `
          <foreignObject x="${x}" y="${y}" width="${NW}" height="${NH}">
            <div xmlns="http://www.w3.org/1999/xhtml"
                 style="height:${NH}px;box-sizing:border-box;padding:6px;
                        border:2px solid ${border};border-radius:12px;
                        background:${picked ? '#332a0c' : '#1e293b'};opacity:${picked ? 1 : .65};">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:2px;">
                <span style="font-size:8px;color:#94a3b8;font-weight:700;">${rank || '未排名'}</span>
                ${picked ? `<span style="background:#facc15;color:#111827;border-radius:999px;
                                      padding:1px 5px;font-size:8px;font-weight:900;">${match} 押</span>` : ''}
              </div>
              <div style="font-size:11px;color:#f8fafc;font-weight:800;text-align:center;
                          line-height:1.15;word-break:break-all;overflow:hidden;height:26px;
                          margin-top:5px;">${displayName(player)}</div>
              <div style="font-size:10px;color:${picked ? '#fde047' : '#cbd5e1'};
                          text-align:center;margin-top:3px;font-family:monospace;">⚡ ${player.power || '—'}</div>
              <div style="font-size:8px;color:#94a3b8;text-align:center;margin-top:3px;
                          font-family:monospace;">⏱ ${player.qualifier_time || '—'}</div>
            </div>
          </foreignObject>`;
      }

      function route(points, active) {
        return `<polyline points="${points}" fill="none"
                 stroke="${active ? '#facc15' : '#25243a'}"
                 stroke-width="${active ? 7 : 6}" stroke-linejoin="round"
                 stroke-linecap="round"/>`;
      }

      function pairRoutes(x1, y1, y2, x2, targetY, advice, a, b, reverse = false) {
        const startX = reverse ? x1 : x1 + NW;
        const endX = reverse ? x2 + NW : x2;
        const elbowX = (startX + endX) / 2;
        const aActive = advice.confidence !== 'insufficient' && advice.winner === a;
        const bActive = advice.confidence !== 'insufficient' && advice.winner === b;
        return `
          ${route(`${startX},${y1 + NH / 2} ${elbowX},${y1 + NH / 2} ${elbowX},${targetY + NH / 2} ${endX},${targetY + NH / 2}`, aActive)}
          ${route(`${startX},${y2 + NH / 2} ${elbowX},${y2 + NH / 2} ${elbowX},${targetY + NH / 2} ${endX},${targetY + NH / 2}`, bActive)}`;
      }

      const upperActive = final.confidence !== 'insufficient' && final.winner === upper.winner;
      const lowerActive = final.confidence !== 'insufficient' && final.winner === lower.winner;
      const centerLineX = centerX + NW / 2;

      return `
        <div class="rounded-2xl border border-slate-700 bg-[radial-gradient(circle_at_center,#312334_0%,#171827_48%,#0b1020_100%)] p-3 md:p-6">
          <svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
               aria-label="第 ${g.id} 組完整對陣與下注建議"
               style="max-width:${W}px;display:block;margin:auto;"
               xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml">
            <text x="${W / 2}" y="18" text-anchor="middle" fill="#fde68a"
                  font-size="13" font-weight="bold">第 ${g.id} 組 · 金色路徑為建議押注</text>

            ${pairRoutes(leftX, topOuterY[0], topOuterY[1], leftInnerX, topStageY, firstRound[0], p[0], p[1])}
            ${pairRoutes(rightX, topOuterY[0], topOuterY[1], rightInnerX, topStageY, firstRound[2], p[4], p[5], true)}
            ${pairRoutes(leftX, bottomOuterY[0], bottomOuterY[1], leftInnerX, bottomStageY, firstRound[1], p[2], p[3])}
            ${pairRoutes(rightX, bottomOuterY[0], bottomOuterY[1], rightInnerX, bottomStageY, firstRound[3], p[6], p[7], true)}

            ${route(`${leftInnerX + NW / 2},${topStageY + NH} ${leftInnerX + NW / 2},${upperY - 18} ${centerLineX},${upperY - 18} ${centerLineX},${upperY}`, upper.confidence !== 'insufficient' && upper.winner === firstRound[0].winner)}
            ${route(`${rightInnerX + NW / 2},${topStageY + NH} ${rightInnerX + NW / 2},${upperY - 18} ${centerLineX},${upperY - 18} ${centerLineX},${upperY}`, upper.confidence !== 'insufficient' && upper.winner === firstRound[2].winner)}
            ${route(`${leftInnerX + NW / 2},${bottomStageY} ${leftInnerX + NW / 2},${lowerY + NH + 18} ${centerLineX},${lowerY + NH + 18} ${centerLineX},${lowerY + NH}`, lower.confidence !== 'insufficient' && lower.winner === firstRound[1].winner)}
            ${route(`${rightInnerX + NW / 2},${bottomStageY} ${rightInnerX + NW / 2},${lowerY + NH + 18} ${centerLineX},${lowerY + NH + 18} ${centerLineX},${lowerY + NH}`, lower.confidence !== 'insufficient' && lower.winner === firstRound[3].winner)}
            ${route(`${centerLineX},${upperY + NH} ${centerLineX},${finalY}`, upperActive)}
            ${route(`${centerLineX},${lowerY} ${centerLineX},${finalY + NH}`, lowerActive)}

            ${entrantNode(p[0], leftX, topOuterY[0], firstRound[0], p[0]._slot)}
            ${entrantNode(p[1], leftX, topOuterY[1], firstRound[0], p[1]._slot)}
            ${entrantNode(p[2], leftX, bottomOuterY[0], firstRound[1], p[2]._slot)}
            ${entrantNode(p[3], leftX, bottomOuterY[1], firstRound[1], p[3]._slot)}
            ${entrantNode(p[4], rightX, topOuterY[0], firstRound[2], p[4]._slot)}
            ${entrantNode(p[5], rightX, topOuterY[1], firstRound[2], p[5]._slot)}
            ${entrantNode(p[6], rightX, bottomOuterY[0], firstRound[3], p[6]._slot)}
            ${entrantNode(p[7], rightX, bottomOuterY[1], firstRound[3], p[7]._slot)}

            ${node(firstRound[0].winner, leftInnerX, topStageY, `${p[0]._slot} 勝者建議`, firstRound[0])}
            ${node(firstRound[2].winner, rightInnerX, topStageY, `${p[4]._slot} 勝者建議`, firstRound[2])}
            ${node(firstRound[1].winner, leftInnerX, bottomStageY, `${p[2]._slot} 勝者建議`, firstRound[1])}
            ${node(firstRound[3].winner, rightInnerX, bottomStageY, `${p[6]._slot} 勝者建議`, firstRound[3])}
            ${node(upper.winner, centerX, upperY, '上半區建議', upper, true)}
            ${node(lower.winner, centerX, lowerY, '下半區建議', lower, true)}
            ${node(final.winner, centerX, finalY, '🏆 組冠軍建議', final, true)}
          </svg>
        </div>`;
    }

    function renderLandscapeBracket(g) {
      const p = bettingPlayers(g);
      const r1 = [
        analyzeMatch(p[0], p[1]),
        analyzeMatch(p[2], p[3]),
        analyzeMatch(p[4], p[5]),
        analyzeMatch(p[6], p[7]),
      ];
      const upper = analyzeMatch(r1[0].winner, r1[2].winner);
      const lower = analyzeMatch(r1[1].winner, r1[3].winner);
      const final = analyzeMatch(upper.winner, lower.winner);
      const W = 1000;
      const H = 600;
      const S = 112;
      const outerX = [0, W - S];
      const innerX = [190, W - 190 - S];
      const centerX = (W - S) / 2;
      const outerY = [24, 164, 324, 464];
      const stageY = [94, 394];
      const finalY = 244;

      function route(points, active) {
        return `<polyline points="${points}" fill="none"
                 stroke="${active ? '#facc15' : '#25243a'}"
                 stroke-width="${active ? 8 : 7}" stroke-linejoin="round"
                 stroke-linecap="round"/>`;
      }

      function square(player, x, y, label, advice, entrant = false) {
        const picked = advice.confidence !== 'insufficient' && advice.winner === player;
        const confidence = CONFIDENCE[advice.confidence];
        const rank = player.qualifier_rank != null ? `#${player.qualifier_rank}` : '未排名';
        const heading = entrant ? rank : label;
        return `
          <foreignObject x="${x}" y="${y}" width="${S}" height="${S}">
            <div xmlns="http://www.w3.org/1999/xhtml"
                 style="height:${S}px;box-sizing:border-box;padding:8px;
                        border:${entrant ? 2 : 3}px solid ${picked || !entrant ? '#facc15' : '#475569'};
                        border-radius:14px;background:${picked || !entrant ? '#332a0c' : '#1e293b'};
                        opacity:${entrant && !picked ? .65 : 1};box-shadow:0 5px 14px rgba(0,0,0,.35);">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:3px;
                          color:${picked || !entrant ? '#fde047' : '#94a3b8'};font-size:9px;
                          font-weight:800;line-height:1.1;">
                <span>${heading}</span>
                ${entrant && picked ? `<span style="background:#facc15;color:#111827;border-radius:999px;
                                              padding:2px 5px;white-space:nowrap;">押</span>` : ''}
              </div>
              <div style="height:32px;margin-top:7px;overflow:hidden;text-align:center;
                          color:#f8fafc;font-size:13px;font-weight:900;line-height:1.2;
                          word-break:break-all;">${advice.confidence === 'insufficient' && !entrant ? '建議跳過' : displayName(player)}</div>
              <div style="margin-top:5px;text-align:center;color:#fde047;font:11px monospace;">
                ⚡ ${player.power || '—'}
              </div>
              <div style="margin-top:4px;text-align:center;color:#94a3b8;font:9px monospace;">
                ${entrant ? `⏱ ${player.qualifier_time || '—'}` : confidence.icon}
              </div>
            </div>
          </foreignObject>`;
      }

      function pairRoutes(side, y1, y2, targetY, advice, a, b) {
        const left = side === 0;
        const startX = left ? outerX[0] + S : outerX[1];
        const endX = left ? innerX[0] : innerX[1] + S;
        const elbow = (startX + endX) / 2;
        const path = (y, active) => route(
          `${startX},${y + S / 2} ${elbow},${y + S / 2} ${elbow},${targetY + S / 2} ${endX},${targetY + S / 2}`,
          active,
        );
        return path(y1, advice.confidence !== 'insufficient' && advice.winner === a)
          + path(y2, advice.confidence !== 'insufficient' && advice.winner === b);
      }

      return `
        <div class="rounded-2xl border border-slate-700 bg-[radial-gradient(circle_at_center,#312334_0%,#171827_48%,#0b1020_100%)] p-4">
          <svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
               aria-label="第 ${g.id} 組完整對陣與下注建議寬版"
               style="max-width:${W}px;display:block;margin:auto;"
               xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml">
            ${pairRoutes(0, outerY[0], outerY[1], stageY[0], r1[0], p[0], p[1])}
            ${pairRoutes(1, outerY[0], outerY[1], stageY[0], r1[2], p[4], p[5])}
            ${pairRoutes(0, outerY[2], outerY[3], stageY[1], r1[1], p[2], p[3])}
            ${pairRoutes(1, outerY[2], outerY[3], stageY[1], r1[3], p[6], p[7])}
            ${route(`${innerX[0] + S},${stageY[0] + S / 2} ${centerX},${stageY[0] + S / 2}`, upper.confidence !== 'insufficient' && upper.winner === r1[0].winner)}
            ${route(`${innerX[1]},${stageY[0] + S / 2} ${centerX + S},${stageY[0] + S / 2}`, upper.confidence !== 'insufficient' && upper.winner === r1[2].winner)}
            ${route(`${innerX[0] + S},${stageY[1] + S / 2} ${centerX},${stageY[1] + S / 2}`, lower.confidence !== 'insufficient' && lower.winner === r1[1].winner)}
            ${route(`${innerX[1]},${stageY[1] + S / 2} ${centerX + S},${stageY[1] + S / 2}`, lower.confidence !== 'insufficient' && lower.winner === r1[3].winner)}
            ${route(`${centerX + S / 2},${stageY[0] + S} ${centerX + S / 2},${finalY}`, final.confidence !== 'insufficient' && final.winner === upper.winner)}
            ${route(`${centerX + S / 2},${stageY[1]} ${centerX + S / 2},${finalY + S}`, final.confidence !== 'insufficient' && final.winner === lower.winner)}

            ${square(p[0], outerX[0], outerY[0], p[0]._slot, r1[0], true)}
            ${square(p[1], outerX[0], outerY[1], p[1]._slot, r1[0], true)}
            ${square(p[2], outerX[0], outerY[2], p[2]._slot, r1[1], true)}
            ${square(p[3], outerX[0], outerY[3], p[3]._slot, r1[1], true)}
            ${square(p[4], outerX[1], outerY[0], p[4]._slot, r1[2], true)}
            ${square(p[5], outerX[1], outerY[1], p[5]._slot, r1[2], true)}
            ${square(p[6], outerX[1], outerY[2], p[6]._slot, r1[3], true)}
            ${square(p[7], outerX[1], outerY[3], p[7]._slot, r1[3], true)}
            ${square(r1[0].winner, innerX[0], stageY[0], `${p[0]._slot} 勝者`, r1[0])}
            ${square(r1[2].winner, innerX[1], stageY[0], `${p[4]._slot} 勝者`, r1[2])}
            ${square(r1[1].winner, innerX[0], stageY[1], `${p[2]._slot} 勝者`, r1[1])}
            ${square(r1[3].winner, innerX[1], stageY[1], `${p[6]._slot} 勝者`, r1[3])}
            ${square(upper.winner, centerX, stageY[0], '上半區建議', upper)}
            ${square(lower.winner, centerX, stageY[1], '下半區建議', lower)}
            ${square(final.winner, centerX, finalY, '🏆 組冠軍', final)}
          </svg>
        </div>`;
    }

    function renderBracket(g) {
      return `
        <div class="bracket-portrait">${renderPortraitBracket(g)}</div>
        <div class="bracket-landscape">${renderLandscapeBracket(g)}</div>`;
    }

    async function init() {
      const params = new URLSearchParams(location.search);
      const ids = await fetchSeasonIds();
      // 預設顯示「最新一屆有分組資料的」而非單純最後一屆——尚未開賽的屆次
      // （status: upcoming）groups 為空，直接顯示會是一片「尚無分組資料」。
      let id = params.get('id');
      let data;
      if (id) {
        data = await fetchSeason(id);
      } else {
        for (let i = ids.length - 1; i >= 0; i--) {
          data = await fetchSeason(ids[i]);
          id = ids[i];
          if (data.groups?.length) break;
        }
      }

      document.title = `${data.date} 淘汰賽對陣 — 弓箭傳說2`;
      document.getElementById('title').textContent = `${data.date} 淘汰賽對陣`;
      document.getElementById('back-link').href = `season.html?id=${id}`;

      const tabsEl = document.getElementById('tabs');
      const adviceEl = document.getElementById('advice-wrap');
      const wrapEl = document.getElementById('bracket-wrap');

      if (!data.groups || !data.groups.length) {
        adviceEl.innerHTML = '<div class="text-slate-500 text-center py-12">尚無分組資料，暫時無法產生下注建議</div>';
        document.getElementById('bracket-section').classList.add('hidden');
        return;
      }

      function showGroup(g) {
        adviceEl.innerHTML = renderAdvice(g);
        wrapEl.innerHTML = renderBracket(g);
      }

      data.groups.forEach((g, i) => {
        const btn = document.createElement('button');
        btn.textContent = `第 ${g.id} 組`;
        btn.className = `px-4 py-2 rounded-lg text-sm font-semibold transition
          ${i === 0 ? 'bg-yellow-500 text-black' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('#tabs button').forEach(b =>
            b.className = 'px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600');
          btn.className = 'px-4 py-2 rounded-lg text-sm font-semibold transition bg-yellow-500 text-black';
          showGroup(g);
        });
        tabsEl.appendChild(btn);
      });

      showGroup(data.groups[0]);
    }

    init();
  </script>
</body>
</html>
