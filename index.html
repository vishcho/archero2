<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="img/fire.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弓箭傳說2 明星賽事紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #e2e8f0; }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-yellow-400 mb-2">⚔️ 弓箭傳說2 明星賽事紀錄</h1>
    <p class="text-slate-400 mb-8">明星盃與超級明星盃的歷屆紀錄</p>
    <div id="cups" class="space-y-10"></div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // 明星盃有完整賽制資料（狀態／冠軍），超級明星盃目前只有選手配置，
    // 因此卡片摘要依 cup.schema 分開處理，不硬套同一組欄位。
    function seasonCard(cup, s) {
      const accent = accentOf(cup);
      const summary = cup.schema === 'season'
        ? (s.champion
            ? `<div class="text-sm ${accent.text} mt-1">🏆 冠軍：${s.champion}</div>`
            : s.status === 'finished'
              ? '<div class="text-sm text-slate-500 mt-1">總決賽資料未收錄</div>'
              : '<div class="text-sm text-slate-500 mt-1">總決賽待定</div>')
        : `<div class="text-sm text-slate-500 mt-1">已收錄 ${(s.roster || []).length} 位選手配置</div>`;

      return `
        <a href="season.html?cup=${cup.slug}&id=${s.id}"
           class="block bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl p-5 transition">
          <div class="flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="text-lg font-bold text-white">${s.date}</span>
                ${statusBadge(s.status)}
              </div>
              <div class="text-sm text-slate-400">主題：${s.theme}</div>
              ${summary}
            </div>
            <span class="text-slate-500 text-xl">›</span>
          </div>
        </a>
      `;
    }

    async function load() {
      const cups = await fetchCups();
      const container = document.getElementById('cups');

      for (const cup of cups) {
        const seasons = (await fetchAllSeasons(cup.slug)).reverse();
        const accent = accentOf(cup);
        const section = document.createElement('section');
        section.innerHTML = `
          <div class="flex items-baseline gap-3 mb-1 border-b border-slate-700 pb-2">
            <h2 class="text-xl font-bold ${accent.text}">${cup.name}</h2>
            <span class="text-xs text-slate-500">${cup.cadence}</span>
          </div>
          <p class="text-xs text-slate-500 mb-4">${cup.format}</p>
          <div class="space-y-4">
            ${seasons.length
              ? seasons.map((s) => seasonCard(cup, s)).join('')
              : '<div class="text-slate-500 text-sm py-6 text-center">尚無收錄</div>'}
          </div>
        `;
        container.appendChild(section);
      }
    }
    load();
  </script>
</body>
</html>
